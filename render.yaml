services:
  - type: web
    name: lca-gpt-enterprise
    runtime: docker
    repo: https://github.com/JayJayjj123456789/LCA-GPT.git
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: poolside/laguna-s-2.1:free
      - key: SERPER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_DATA_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://lca-gpt-enterprise.onrender.com